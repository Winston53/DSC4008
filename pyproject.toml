[project]
name = "dsc4008-image"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fiftyone>=1.22.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=1.26.4,<2",
    "pillow>=13.0.0",
    "tqdm>=4.70.1",
    "torch==2.7.1",
]
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
